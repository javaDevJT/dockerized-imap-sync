name: Renovate verification
on:
  push:
    branches: [chore/renovate-private-runner]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: renovate-verify-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Renovate dependency CI
    if: >-
      github.repository == 'javaDevJT/dockerized-imap-sync' &&
      ((github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.id == github.event.repository.id) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/chore/renovate-private-runner'))
    runs-on: truenas-dockerized-imap-sync-storage-6g
    timeout-minutes: 60
    steps:
      - name: Select the dependency verification scope
        id: scope
        env:
          IS_DEPENDENCY_UPDATE: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.id == 29139614 && startsWith(github.head_ref, 'renovate/') && github.head_ref != 'renovate/configure' }}
          IS_ONBOARDING: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'renovate/configure' || github.head_ref == 'chore/renovate-onboarding') }}
        run: |
          echo "deps=$IS_DEPENDENCY_UPDATE" >> "$GITHUB_OUTPUT"
          echo "setup=$IS_ONBOARDING" >> "$GITHUB_OUTPUT"
          if [[ "$IS_DEPENDENCY_UPDATE" == false && "$IS_ONBOARDING" == false ]]; then
            echo "This pull request uses the repository's normal CI."
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.scope.outputs.deps == 'true' || steps.scope.outputs.setup == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.scope.outputs.setup == 'true'
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Validate the Renovate configuration
        if: steps.scope.outputs.setup == 'true'
        run: npx --yes --package renovate@45.1.2 -- renovate-config-validator --strict
      - name: Start BuildKit storage collection
        if: steps.scope.outputs.deps == 'true'
        run: ci-storage-efficiency start
      - name: Set up Buildx on the private BuildKit service
        if: steps.scope.outputs.deps == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          cache-binary: false
          driver: remote
          endpoint: tcp://buildkit:1234
          driver-opts: |
            cacert=/run/buildkit/tls/ca.pem
            cert=/run/buildkit/tls/client.pem
            key=/run/buildkit/tls/client.key
      - name: Prepare local OCI candidate
        if: steps.scope.outputs.deps == 'true'
        id: container_security_pr
        shell: bash
        env:
          SECURITY_PUBLISH: "false"
          SECURITY_REPORT_DIRECTORY: ${{ runner.temp }}/container-security/pr
        run: bash .github/actions/container-security/container-security.sh prepare
      - name: Build pull request image without registry credentials
        if: steps.scope.outputs.deps == 'true'
        id: container_build_pr
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          platforms: linux/amd64
          outputs: ${{ steps.container_security_pr.outputs.exporter }}
          context: .
          file: ./Dockerfile
          build-args: |
            QB_SOURCE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
            BUILD_REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          pull: true
          push: false
      - name: Generate SBOM and enforce High/Critical vulnerability gate
        if: steps.scope.outputs.deps == 'true'
        uses: ./.github/actions/container-security
        with:
          image: ${{ steps.container_security_pr.outputs.archive }}
          platforms: "linux/amd64"
          report-directory: ${{ runner.temp }}/container-security/pr
          artifact-name: container-security-pr-${{ github.run_id }}-${{ github.run_attempt }}
          revision: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Remove local PR candidate and reports
        if: always() && steps.scope.outputs.deps == 'true'
        shell: bash
        env:
          SECURITY_ARCHIVE: ${{ steps.container_security_pr.outputs.archive }}
          SECURITY_REPORT_DIRECTORY: ${{ runner.temp }}/container-security/pr
        run: |
          set -euo pipefail
          if [[ -n "$SECURITY_ARCHIVE" ]]; then rm -f -- "$SECURITY_ARCHIVE"; fi
          rm -rf -- "$SECURITY_REPORT_DIRECTORY"
      - name: Finish and enforce BuildKit storage usage
        if: always() && steps.scope.outputs.deps == 'true'
        run: ci-storage-efficiency finish
