name: Build and Publish Image

on:
  schedule:
    - cron: '22 0 * * *'
      timezone: America/Detroit
  push:
    branches:
      - main
  pull_request_target:
  workflow_dispatch:

env:
  DOCKER_BUILD_RECORD_RETENTION_DAYS: "1"

  DOCKER_BUILD_RECORD_UPLOAD: "false"
jobs:
  validate-pr:
    name: Build and scan pull request image
    if: >-
      github.repository == 'javaDevJT/dockerized-imap-sync' &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.actor == 'javaDevJT' && github.event.pull_request.user.login == 'javaDevJT') ||
       (github.actor == 'quarterback-ci[bot]' && github.event.pull_request.user.id == 341165314) ||
       (github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.user.id == 49699333))
    runs-on: truenas-dockerized-imap-sync-storage-6g
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BUILDKIT_HOST: tcp://buildkit:1234
      BUILDKIT_TLS_CA_CERT: /run/buildkit/tls/ca.pem
      BUILDKIT_TLS_CLIENT_CERT: /run/buildkit/tls/client.pem
      BUILDKIT_TLS_CLIENT_KEY: /run/buildkit/tls/client.key
    steps:
      - name: Start BuildKit storage collection
        run: ci-storage-efficiency start
      - name: Check out authorized same-repository pull request source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Buildx on the private BuildKit service
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
          driver: remote
          endpoint: tcp://buildkit:1234
          driver-opts: |
            cacert=/run/buildkit/tls/ca.pem
            cert=/run/buildkit/tls/client.pem
            key=/run/buildkit/tls/client.key
      - name: Prepare local OCI candidate
        id: container_security_pr
        shell: bash
        env:
          SECURITY_PUBLISH: "false"
          SECURITY_REPORT_DIRECTORY: ${{ runner.temp }}/container-security/pr
        run: bash .github/actions/container-security/container-security.sh prepare
      - name: Build pull request image without registry credentials
        id: container_build_pr
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          outputs: ${{ steps.container_security_pr.outputs.exporter }}
          context: .
          file: ./Dockerfile
          build-args: |
            QB_SOURCE_COMMIT=${{ github.event.pull_request.head.sha }}
            BUILD_REVISION=${{ github.event.pull_request.head.sha }}
          pull: true
          push: false
      - name: Generate SBOM and enforce High/Critical vulnerability gate
        uses: ./.github/actions/container-security
        with:
          image: ${{ steps.container_security_pr.outputs.archive }}
          platforms: "linux/amd64"
          report-directory: ${{ runner.temp }}/container-security/pr
          artifact-name: container-security-pr-${{ github.run_id }}-${{ github.run_attempt }}
          revision: ${{ github.event.pull_request.head.sha }}
      - name: Remove local PR candidate and reports
        if: always()
        shell: bash
        env:
          SECURITY_ARCHIVE: ${{ steps.container_security_pr.outputs.archive }}
          SECURITY_REPORT_DIRECTORY: ${{ runner.temp }}/container-security/pr
        run: |
          set -euo pipefail
          if [[ -n "$SECURITY_ARCHIVE" ]]; then rm -f -- "$SECURITY_ARCHIVE"; fi
          rm -rf -- "$SECURITY_REPORT_DIRECTORY"
      - name: Finish and enforce BuildKit storage usage
        if: always()
        run: ci-storage-efficiency finish

  docker:
    if: github.repository == 'javaDevJT/dockerized-imap-sync' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target'
    runs-on: truenas-dockerized-imap-sync-storage-6g
    permissions:
      contents: read
      packages: write

    env:
      BUILDKIT_HOST: tcp://buildkit:1234
      BUILDKIT_TLS_CA_CERT: /run/buildkit/tls/ca.pem
      BUILDKIT_TLS_CLIENT_CERT: /run/buildkit/tls/client.pem
      BUILDKIT_TLS_CLIENT_KEY: /run/buildkit/tls/client.key
    steps:
      - name: Start BuildKit storage collection
        run: ci-storage-efficiency start
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: ${{ github.repository == 'javaDevJT/dockerized-imap-sync' && (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
          driver: remote
          endpoint: tcp://buildkit:1234
          driver-opts: |
            cacert=/run/buildkit/tls/ca.pem
            cert=/run/buildkit/tls/client.pem
            key=/run/buildkit/tls/client.key

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dockerized-imap-sync
          tags: |
            type=raw,value=latest
            type=sha

      - name: Prepare disk build cache
        id: ci_disk_cache_1
        run: ci-cache "truenas-7586cd64b4ecc22d"
      - name: Prepare immutable image and release tags
        id: container_security_1
        shell: bash
        env:
          SECURITY_PUBLISH: "true"
          SECURITY_RELEASE_TAGS: |
            ${{ steps.meta.outputs.tags }}
          SECURITY_REPORT_DIRECTORY: ${{ runner.temp }}/container-security/build-1
        run: bash .github/actions/container-security/container-security.sh prepare
      - name: Build and push image
        id: container_build_1
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          outputs: ${{ steps.container_security_1.outputs.exporter }}
          cache-from: |
            type=local,src=${{ steps.ci_disk_cache_1.outputs.from }}
          cache-to: ${{ steps.ci_disk_cache_1.outputs.to && format('type=local,dest={0},mode=max,ignore-error=true', steps.ci_disk_cache_1.outputs.to) || '' }}
          context: .
          build-args: |
            QB_SOURCE_COMMIT=${{ github.sha }}
            BUILD_REVISION=${{ github.sha }}
          push: false # Push-by-digest is configured in the exporter; tags follow the scan.
          tags: ${{ steps.container_security_1.outputs.repository }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Generate SBOM and enforce High/Critical vulnerability gate
        uses: ./.github/actions/container-security
        with:
          image: registry:${{ steps.container_security_1.outputs.repository }}@${{ steps.container_build_1.outputs.digest }}
          platforms: "linux/amd64"
          report-directory: ${{ runner.temp }}/container-security/build-1
          artifact-name: container-security-${{ github.job }}-${{ strategy.job-index || 0 }}-build-1
      - name: Finish and enforce BuildKit storage usage
        if: always()
        run: ci-storage-efficiency finish
      - name: Format bounded plaintext storage diagnostics
        id: storage_log
        if: always()
        run: |
          python3 .github/scripts/format-storage-evidence.py \
            --output "$RUNNER_TEMP/ci-storage-evidence.log" \
            --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA" \
            --usage-input "$RUNNER_TEMP/ci-storage-usage-start.json" \
            --usage-input "$RUNNER_TEMP/ci-storage-usage.json"
      - name: Upload bounded storage diagnostics
        if: ${{ always() && steps.storage_log.outputs.available == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-log-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-storage-evidence.log
          if-no-files-found: error
          retention-days: 1
      - name: Publish release tags only after the vulnerability gate passes
        shell: bash
        env:
          SECURITY_IMAGE: ${{ steps.container_security_1.outputs.repository }}@${{ steps.container_build_1.outputs.digest }}
          SECURITY_REPORT_DIRECTORY: ${{ runner.temp }}/container-security/build-1
        run: bash .github/actions/container-security/container-security.sh publish
      - name: Emit verified build receipt marker
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PUBLISHED_DIGESTS: ${{ runner.temp }}/container-security/build-1/published-digests.txt
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ -s "$PUBLISHED_DIGESTS" ]]
          published_digest=""
          while IFS=' ' read -r tag digest extra; do
            [[ -n "$tag" && "$digest" =~ ^sha256:[a-f0-9]{64}$ && -z "${extra:-}" ]]
            if [[ -z "$published_digest" ]]; then
              published_digest="$digest"
            else
              [[ "$published_digest" == "$digest" ]]
            fi
          done < "$PUBLISHED_DIGESTS"
          [[ -n "$published_digest" ]]
          printf 'QB_BUILD_RECEIPT_V1 source_sha=%s run_id=%s run_attempt=%s digest=%s\n' \
            "$SOURCE_SHA" "$RUN_ID" "$RUN_ATTEMPT" "$published_digest"

  cleanup-artifacts:
    name: Remove transient build artifacts
    needs: ["docker"]
    if: ${{ always() && github.repository == 'javaDevJT/dockerized-imap-sync' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target' }}
    runs-on: truenas-dockerized-imap-sync-storage-8g
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out trusted default branch cleanup code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python for bounded cleanup
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Delete non-retained current-run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/cleanup-actions-artifacts.py --current

